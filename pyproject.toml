[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aten-size-profiler"
dynamic = ["version"]
description = "ATen operator input shape and size profiler for PyTorch Eager workloads"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "yoshua", email = "yaozuhua2077@126.com" },
]
dependencies = [
    "PyYAML>=6.0",
    "openpyxl>=3.1",
]

[project.urls]
Homepage = "https://github.com/yaozh1/ATen_Size_Profiler"
Repository = "https://github.com/yaozh1/ATen_Size_Profiler"
Issues = "https://github.com/yaozh1/ATen_Size_Profiler/issues"

[tool.setuptools.dynamic]
version = {attr = "aten_size_profiler.__version__"}

[tool.setuptools]
packages = ["aten_size_profiler"]
